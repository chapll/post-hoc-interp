# Validation-specific config. Merged on top of base.yaml.
# Small scale: 6 problems per dataset, short generation for speed.

data:
  datasets:
    - gsm_symbolic
    - folio
    - strategyqa
  problems_per_dataset: 6

model:
  # Shorter generation for validation. Full-length traces need dedicated GPUs.
  max_new_tokens: 512

storage:
  # Full layer subset. With 512 max tokens, this fits in ~20GB per worker.
  # Requires dedicated GPU access (no sharing with other processes).
  layer_subset: [0, 4, 8, 12, 16, 20, 24, 28, 32, 35]
  top_k_logits: 50
  save_attention: false

validation:
  verify_round_trip: true
  verify_shapes: true
  verify_think_tokens: true
