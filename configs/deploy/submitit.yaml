# @package _global_
# Slurm submission via submitit
#
# Per-user settings: Set these in your .env file or override on command line:
#   SLURM_PARTITION=your-partition
#   SLURM_ACCOUNT=your-account (optional)
#
# Example usage:
#   uv run train +deploy=submitit hydra.launcher.partition=$SLURM_PARTITION

defaults:
  - override hydra/launcher: submitit_slurm

hydra:
  mode: MULTIRUN
  sweep:
    dir: ${deploy_paths.run_dir}
    subdir: ${hydra.job.num}
  launcher:
    # Required - override via CLI or create personal deploy config
    partition: ${oc.env:SLURM_PARTITION,???}
    account: ${oc.env:SLURM_ACCOUNT,null}

    # Cluster resources - adjust per experiment
    nodes: 1
    tasks_per_node: 1
    gpus_per_node: 8
    cpus_per_task: 32
    timeout_min: 60
    mem_gb: 256

    # Optional setup commands (e.g., module loads)
    setup: null
    additional_parameters: {}
