# Per-token dense probing experiment config
# Merges on top of base.yaml via load_config("configs/per_token_probe.yaml")
#
# Probes every thinking token position for target traces using KV-cache-
# efficient descending-order probing. Supports multi-trace runs with resume.

per_token_probe:
  # Target traces (each probed at every thinking token position)
  traces:
    - problem_id: "gsm_symbolic_68_fresh_false_cfga"
      dataset: "gsm_symbolic"
      trace_index: 0
    - problem_id: "gsm_symbolic_56_original_false_cfgb"
      dataset: "gsm_symbolic"
      trace_index: 0
    - problem_id: "gsm_symbolic_81_original_false_cfga"
      dataset: "gsm_symbolic"
      trace_index: 0
    - problem_id: "gsm_symbolic_2_original_false_cfgb"
      dataset: "gsm_symbolic"
      trace_index: 0

  # Probing parameters
  min_probe_spacing: 1            # CRITICAL: must be 1 to get every position
  max_new_tokens: 15              # same as Phase 2.2/2.3

  # Memory management
  empty_cache_interval: 100       # call torch.cuda.empty_cache() every N probes

  # Token IDs (same as Phase 2.2/2.3)
  close_token_ids: [151668, 198]  # </think> + \n
  mu_token_id: 39120              # "Mu" (single token)
  nu_token_id: 60335              # "Nu" (single token)

paths:
  traces_dir: "${paths.data_dir}/traces"
  output_dir: "${oc.env:EXP_DIR}/per_token_probe"

gpus: [0]
