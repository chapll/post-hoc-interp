# Modal trace generation configuration
# Used by: modal run scripts/modal_generate.py

# Modal infrastructure settings
modal:
  n_containers: 4           # Number of parallel A100-80GB containers
  gpu_type: "a100-80gb"     # GPU type (a100-80gb, a10g, etc.)
  timeout: 7200             # Timeout per container in seconds (2 hours)
  retries: 2                # Number of retries on failure

# Model settings
model:
  name: "Qwen/Qwen3-8B"
  dtype: "bfloat16"
  max_new_tokens: 4096

# Generation parameters
generation:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  do_sample: true

# Dataset settings
data:
  # Swapped-label protocol: uses Rho/Tau tokens with A/B configs
  label_protocol: "swapped"
  traces_per_problem: 3
  # GSM-Symbolic: n fresh + n original problems (contamination analysis)
  gsm_problems_per_type: 10
  # FOLIO: logical reasoning problems
  folio_problems: 10
  # StrategyQA: commonsense reasoning problems
  strategyqa_problems: 10

# Random seed for reproducibility
seed: 137
