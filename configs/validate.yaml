# Validation-specific config. Merged on top of base.yaml.
# Small scale: 6 problems per dataset, short generation for speed.

data:
  datasets:
    - gsm_symbolic
    - folio
    - strategyqa
  problems_per_dataset: 6

model:
  # Full generation so traces complete with </think> token.
  # Requires dedicated GPU access (no sharing with other processes).
  max_new_tokens: 4096

storage:
  # Reduced layer subset for validation to fit long traces in memory.
  # Full 10-layer capture at production scale uses chunked processing.
  layer_subset: [0, 16, 35]
  top_k_logits: 50
  save_attention: false

validation:
  verify_round_trip: true
  verify_shapes: true
  verify_think_tokens: true
