[project]
name = "cs224n-final-proj"
version = "0.1.0"
description = "final project repository for stanford cs224n"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "torch==2.9.0",
    "tqdm>=4.67.1",
    "wandb>=0.23.1",
]

[project.scripts]
train = "src.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 160
