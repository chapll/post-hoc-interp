[project]
name = "post-hoc-interp"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "einops>=0.8.1",
    "matplotlib>=3.10.8",
    "nnsight>=0.5.15",
    "numpy>=2.4.1",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.2.1",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "torch==2.9.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 160
