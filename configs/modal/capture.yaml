# Modal activation capture configuration
# Used by: modal run scripts/modal_capture_activations.py

# Modal infrastructure settings
modal:
  n_containers: 4           # Number of parallel A100-80GB containers
  gpu_type: "a100-80gb"     # GPU type (a100-80gb, a10g, etc.)
  timeout: 7200             # Timeout per container in seconds (2 hours)
  retries: 1                # Number of retries on failure

# Model settings
model:
  name: "Qwen/Qwen3-8B"

# Activation capture settings
capture:
  num_layers: 36
  chunk_size: 12            # Layers per forward pass (3 passes total)
  top_k_logits: 50
  verify_logits: true
  logits_rtol: 0.01
  logits_atol: 0.01

# Random seed for reproducibility
seed: 137
