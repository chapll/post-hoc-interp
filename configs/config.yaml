defaults:
  - job: default
  - model: default
  - training: default
  - checkpoint: default
  - wandb: default
  - parallelism: default
  - comm: default
  - _self_

# Per-user paths - override via environment or deploy config
deploy_paths:
  exp_dir: ${oc.env:EXP_DIR,./exp}
  data_dir: ${oc.env:DATA_DIR,./data}
  date: ${now_date:}
  run_name: ${job.exp_name}_${now_time:}
  run_dir: ${deploy_paths.exp_dir}/${deploy_paths.date}/${deploy_paths.run_name}
  checkpoint_dir: ${deploy_paths.run_dir}/checkpoint
